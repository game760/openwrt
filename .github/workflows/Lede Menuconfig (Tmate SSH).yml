name: Lede Menuconfig TTYD（网页，账号密码登录）
on:
  workflow_dispatch:
    inputs:
      SRC_REPO:
        description: Lede源码
        required: true
        default: 'https://github.com/coolsnowwolf/lede.git'
      SRC_BRANCH:
        description: 分支
        required: true
        default: 'master'
      WAIT_MIN:
        description: 等待时长(分钟)
        required: true
        default: '180'

env:
  TTYD_PORT: 7681
  TTYD_USER: lede
  TTYD_PASS: lede123456

jobs:
  menuconfig:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout 仓库文件
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison gawk g++ gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget subversion ca-certificates curl cmake libjson-c-dev libwebsockets-dev jq

      - name: 编译安装 ttyd
        run: |
          git clone https://github.com/tsl0922/ttyd.git
          cd ttyd
          mkdir build && cd build
          cmake ..
          make -j$(nproc)
          sudo make install
          cd ../..
          ttyd --version

      - name: 拉取 Lede 源码
        run: |
          git clone --depth 1 -b ${{ github.event.inputs.SRC_BRANCH }} ${{ github.event.inputs.SRC_REPO }} lede
          cd lede
          # 可选启用 diy-part1.sh，有文件再打开
          # chmod +x ../diy-part1.sh
          # bash ../diy-part1.sh
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 启动 ttyd
        run: |
          cd lede
          ttyd -p ${{ env.TTYD_PORT }} -c ${{ env.TTYD_USER }}:${{ env.TTYD_PASS }} bash &
          sleep 2
          echo "✅ TTYD账号：${{ env.TTYD_USER }}"
          echo "✅ TTYD密码：${{ env.TTYD_PASS }}"

      - name: 启动 Cloudflared Quick Tunnel（JSON模式抓取链接，忽略退出码）
        run: |
          wget https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          # nohup后台运行，输出json，方便jq提取链接
          nohup cloudflared tunnel --url http://127.0.0.1:${{ env.TTYD_PORT }} --output json > cf.log 2>&1 &
          sleep 10
          # 从json日志提取url
          TUNNEL_URL=$(jq -r 'select(.url != null) | .url' cf.log | head -n1)
          echo "===================== 你的网页链接 ====================="
          echo $TUNNEL_URL
          echo "账号: ${{ env.TTYD_USER }}"
          echo "密码: ${{ env.TTYD_PASS }}"
          echo "======================================================"
          echo "进入网页终端后执行：cd $GITHUB_WORKSPACE/lede && make menuconfig"
          echo "选完配置手动取消Workflow"
          # 主循环，卡住任务，就算cloudflared挂了也不会报错终止
          while true; do sleep 300; done
        continue-on-error: true
